name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Run Unit Tests & Build Debug APK
        run: gradle test assembleDebug --stacktrace

      - name: Rename APK for easy download
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/DokkerAnalyse-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DokkerAnalyse-APK
          path: app/build/outputs/apk/debug/DokkerAnalyse-debug.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Releases (latest-build)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: "Latest DokkerAnalyse APK Build"
          body: |
            Automated build of **Dokker 1.5 dCi (2014) Climate & OBD2 Analyzer** (`DokkerAnalyse-debug.apk`).
            Download `DokkerAnalyse-debug.apk` below on your Android phone to install it.
          files: app/build/outputs/apk/debug/DokkerAnalyse-debug.apk
          prerelease: false
          make_latest: true
